<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Coding Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" rx="12" fill="url(#bgGrad)" />
  <rect width="800" height="260" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Pattern Overlay (subtle) -->
  <g opacity="0.08">
    <path d="M 0,20 L 800,20 M 0,40 L 800,40 M 0,60 L 800,60 M 0,80 L 800,80 M 0,100 L 800,100 M 0,120 L 800,120 M 0,140 L 800,140 M 0,160 L 800,160 M 0,180 L 800,180 M 0,200 L 800,200 M 0,220 L 800,220 M 0,240 L 800,240" stroke="#475569" stroke-width="0.5" />
    <path d="M 40,0 L 40,260 M 80,0 L 80,260 M 120,0 L 120,260 M 160,0 L 160,260 M 200,0 L 200,260 M 240,0 L 240,260 M 280,0 L 280,260 M 320,0 L 320,260 M 360,0 L 360,260 M 400,0 L 400,260 M 440,0 L 440,260 M 480,0 L 480,260 M 520,0 L 520,260 M 560,0 L 560,260 M 600,0 L 600,260 M 640,0 L 640,260 M 680,0 L 680,260 M 720,0 L 720,260 M 760,0 L 760,260" stroke="#475569" stroke-width="0.5" />
  </g>

  <!-- Decorative Circuit/Graph Lines (AI & Tech theme) -->
  <g opacity="0.25">
    <path d="M 620,60 L 660,100 L 740,100" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M 660,100 L 690,150 L 760,150" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <path d="M 640,180 L 680,180 L 710,210 L 750,210" fill="none" stroke="#ec4899" stroke-width="1.5" />
    
    <!-- Graph Nodes -->
    <circle cx="620" cy="60" r="4" fill="#3b82f6" />
    <circle cx="660" cy="100" r="5" fill="#8b5cf6" />
    <circle cx="740" cy="100" r="3" fill="#3b82f6" />
    <circle cx="690" cy="150" r="4" fill="#ec4899" />
    <circle cx="760" cy="150" r="6" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="640" cy="180" r="3" fill="#ec4899" />
    <circle cx="710" cy="210" r="5" fill="#3b82f6" />
    <circle cx="750" cy="210" r="4" fill="#ec4899" />
  </g>

  <!-- Left Side Coding/Tech Symbol -->
  <g opacity="0.12" transform="translate(45, 60)">
    <!-- Brackets -->
    <text x="0" y="70" font-family="monospace" font-size="90" font-weight="bold" fill="#06b6d4">&lt;</text>
    <text x="90" y="70" font-family="monospace" font-size="90" font-weight="bold" fill="#06b6d4">&gt;</text>
    <!-- Slash -->
    <path d="M 75,-10 L 45,90" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Typography & Text Content -->
  <g transform="translate(100, 75)">
    <!-- Welcome Tag -->
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" letter-spacing="1">WELCOME TO</text>

    <!-- Main Title (Name) -->
    <text x="0" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.5" filter="url(#glow)">
      GAURAV KUMAR PANDEY
    </text>

    <!-- Subtitle (Role) -->
    <text x="0" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Full-Stack Engineer  •  AI/ML Practitioner  •  Fintech Developer
    </text>

    <!-- Core Domains/Keywords -->
    <g transform="translate(0, 125)">
      <!-- Tag 1: Spring Boot / Kotlin -->
      <rect x="0" y="0" width="125" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#10b981" />
      <text x="20" y="15" font-family="monospace" font-size="11" fill="#cbd5e1">Spring &amp; Kotlin</text>

      <!-- Tag 2: Graph Neural Networks -->
      <rect x="135" y="0" width="165" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="145" cy="11" r="3" fill="#6366f1" />
      <text x="155" y="15" font-family="monospace" font-size="11" fill="#cbd5e1">Graph Neural Networks</text>

      <!-- Tag 3: Quantitative Fintech -->
      <rect x="310" y="0" width="155" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="320" cy="11" r="3" fill="#f43f5e" />
      <text x="330" y="15" font-family="monospace" font-size="11" fill="#cbd5e1">Quantitative Systems</text>
    </g>
  </g>
</svg>
